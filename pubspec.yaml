  url_launcher: ^6.3.1
  uuid: ^4.4.2
  in_app_review: ^2.0.10
  image_picker: ^1.0.7
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  image: ^4.2.0
  gal: ^2.3.0
