name: tryon_ai
description: "A new Flutter project."

publish_to: "none"

version: 2.0.6+37

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  dio: ^5.7.0
  tuple: ^2.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  smooth_page_indicator: ^1.2.0+3
  firebase_core: ^3.8.0
